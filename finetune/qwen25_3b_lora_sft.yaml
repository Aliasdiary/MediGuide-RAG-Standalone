### Optional non-quantized LoRA config for RTX 4090 24GB.
### Prefer qwen25_3b_qlora_sft.yaml first; use this only after QLoRA works.

stage: sft
do_train: true
finetuning_type: lora

model_name_or_path: /root/autodl-tmp/models/Qwen2.5-3B-Instruct
template: qwen
trust_remote_code: true

dataset_dir: /root/autodl-tmp/MediGuide-RAG-Standalone/finetune/llamafactory_data
dataset: mediguide_sft_train
eval_dataset: mediguide_sft_valid
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: /root/autodl-tmp/MediGuide-RAG-Standalone/finetune/output/qwen25-3b-mediguide-lora
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0

bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

val_size: 0.0
eval_strategy: steps
eval_steps: 500
save_total_limit: 2
